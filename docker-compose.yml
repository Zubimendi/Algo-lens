services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
