services:
  api:
    build: ./backend
    ports:
      - "8005:8005"
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8005
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8005
